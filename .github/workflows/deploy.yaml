name: Deploy Quartz site to GitHub Pages

on:
  repository_dispatch:
    types: [update-content-submodule]
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
  
     # Step 2: Checkout the private content repository into the 'content' directory
      - name: Checkout Content Repo
        uses: actions/checkout@v4
        with:
          repository: pnposch/2bcon # Replace with your repo's path
          path: content # This is the directory where the repo will be cloned
          ssh-key: ${{ secrets.READ_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
